<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <p>CRUD</p>
        <h1>Acorda Molestinho</h1>
    </header>

    <section id="GET">
        <h2>Ver</h2>
        <button id="bnt-listar"> Listar </button>
        <div id="lista"></div>
    </section>

    <section id="POST">
        <h2>Cadastrar</h2>
        <input id="card-nome" type="text" placeholder="nome">
        <input id="card-email" placeholder="email">
        <input id="card-senha" type="password" placeholder="senha">
        <button id="btn-cadastrar">Cadastrar</button>
    </section>

    <section id="PUT">
        <h2>Atualizar</h2>
        <input id="att-id" type="text" placeholder="nome">
        <input id="att-nome" type="text" placeholder="nome">
        <input id="att-email" placeholder="email">
        <input id="att-senha" type="password" placeholder="senha">
        <button id="btn-att"> Atualizar </button>
    </section>

    <section id="DELETE">
        <h2>Apagar</h2>
        <input id="deletar-id" type="text" placeholder="id">
        <button id="btn-apagar" class="danger">Apagar</button>
    </section>
</body>
</html>
